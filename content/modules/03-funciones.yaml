assessment_evidence:
  - Implementa una función con parámetros y valor de retorno.
  - Usa un parámetro por defecto sin duplicar funciones.
  - Descompone un resultado en múltiples valores retornados.
  - Reemplaza una verificación repetida por una función booleana.

