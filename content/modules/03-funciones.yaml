    range: A12:C21

purpose: >-
  Dividir una solución en operaciones reutilizables con entradas, resultados y
  responsabilidades claras.

prerequisites:
  - unit-02

learning_outcomes:
  - Definir funciones con una responsabilidad específica.
  - Utilizar parámetros obligatorios y parámetros por defecto.
  - Retornar uno o varios valores.
  - Resolver problemas sin depender de variables globales.
  - Encapsular verificaciones en funciones booleanas.

